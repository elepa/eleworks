<!DOCTYPE html>

        }
        .contenedor {
            max-width: 500px;

        h1 { color: #2ecc71; margin-bottom: 10px; }
        p { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
        .boton {

            padding: 12px 24px;
            background-color: rgb(167, 237, 246);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .boton:hover { background-color: #2ecc71;; }
    </style>
</head>
<body>
